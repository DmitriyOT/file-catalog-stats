# mypy configuration. Keep this file ASCII-only:
# configparser reads it in the locale encoding.
[mypy]
python_version = 3.12
# Pragmatic level: core checks, not strict
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
# Some libraries ship no type stubs - do not fail on them
ignore_missing_imports = True
