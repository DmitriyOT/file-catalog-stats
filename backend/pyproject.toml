[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Query/Depends в значениях по умолчанию — идиома FastAPI, а не баг
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.bandit]
# Тесты не проверяем: там осознанно моки, assert'ы и фейковые клиенты
exclude_dirs = ["tests"]
